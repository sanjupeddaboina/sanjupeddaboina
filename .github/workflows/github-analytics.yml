name: Update GitHub Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Analytics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: sanjupeddaboina
          cards: overview,contributions,repositories,languages
          output-dir: assets
          themes: light,dark
          language-limit: 8
          commit: true
